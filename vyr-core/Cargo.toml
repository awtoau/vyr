[package]
name = "vyr-core"
description = "IR-native render core: render tree, layout protocol, Canvas trait, painters, counters (no_std + alloc)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Painter (F1). no_std: default features off, no-std-float supplies the float
# intrinsics. Core policy (invariant I7): no std-only deps, no
# filesystem/clock/thread deps.
tiny-skia = { version = "0.11", default-features = false, features = ["no-std-float"] }
# Deterministic software float math for our own curve flattening (same
# rounding on every host and on thumbv7em — no platform libm variance).
libm = "0.2"
# IR ingestion (F3) — no_std + alloc.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
# Font parsing (F5): charmap, metrics/advances, glyph outlines. no_std via the
# `libm` feature (core_maths float shims) — the FULL text path builds for MCU
# (invariant I7). Bake-off outcome recorded on issue #5.
skrifa = { version = "0.43", default-features = false, features = ["libm"] }

[dev-dependencies]
# Tests are std (separate crates); png is for optional VYR_TEST_DUMP output.
png = "0.17"
