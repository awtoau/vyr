[package]
name = "vyr-scene"
description = "Frame-indexed animated test scenes as IR JSON (no_std + alloc) — shared verbatim by the host rig and the M4 measurement vehicle so both legs animate the SAME pixels"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# The generator itself stays integer-only: it runs INSIDE the measured window
# on the M4, so anything it costs is charged to the renderer's insns/frame — a
# committed sine table, no libm (a single `sinf` is ~1,145 M4 instructions, see
# docs/measurements/perf-history.md #32), no float in the string path.
#
# #55 adds ONE dependency, vyr-core (the render core already linked in every
# leg — no new code, no cycle: vyr-core does not depend on vyr-scene). It is
# what lets `scene_tree`/`animate` hold ONE typed `Request` tree for the whole
# animation and mutate only the animating fields per frame (writing the typed
# caches directly), instead of the old stringify→parse→resolve round-trip
# `scene_ir` + `Request::parse` paid every frame. vyr-core is no_std + alloc,
# so vyr-scene stays no_std + alloc and the check-mcu gate is unaffected.
[dependencies]
vyr-core = { path = "../vyr-core" }
