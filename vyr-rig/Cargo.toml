[package]
name = "vyr-rig"
description = "F18 test rig: frame-indexed deterministic animation driver (full-vs-incremental byte equality + FNV hash chain), resolution ladder to 4K, self-contained for the qemu cross-ISA rung"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vyr-core = { path = "../vyr-core" }
# The frame-indexed scene generators (no_std + alloc), shared verbatim with
# the M4 measurement vehicle so both legs animate the same pixels.
vyr-scene = { path = "../vyr-scene" }
# Hash-chain / ladder JSON files (std side — the rig is a shell harness like
# vyr-bench; vyr-core is untouched by F18).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decode the EMBEDDED checker asset + encode the animation PNG sequence.
png = "0.17"
