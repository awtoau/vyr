[package]
name = "vyr-size"
description = "F9 static-size measurement vehicle: a linked thumbv7em ELF over the real render path (NOT runnable firmware)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# A measurement stub, never a published crate.
publish = false

[features]
# Default = everything, so the host gate (check / clippy / test) compiles
# every cfg branch and `cargo run -p vyr-size` smoke-runs the full stub.
# The size matrix opts DOWN: `--no-default-features [--features font[,image]]`.
default = ["font", "image"]
# Bake fonts/roboto.ttf into .rodata + render the F5 text fixture (the MCU
# model: TTF in flash, glyph cache in RAM).
font = []
# Bake the 24x24 RGBA checker into .rodata + render the F6 image fixture
# (the F15 bake-to-flash model: decode is a build step, the device blits).
image = []
# The F9 RUNNABLE M4 vehicle (#9 dynamic half): vector table + crt0 +
# semihosting + a counted real heap (alloc AND dealloc — the bump arena
# can't run a banded frame) + the banded 480x270 workload over the ASCII
# subset font (assets/roboto-ascii.ttf). Build
# `--no-default-features --features run-qemu` (./dev.py qemu-m4) — its own
# config, never combined with font/image (those bake the size-matrix
# fixtures). On hosts this feature runs the SAME workload under a counting
# allocator and prints the same lines — the cross-ISA hash reference.
run-qemu = ["dep:linked_list_allocator"]
# F16 (#16): render the run-qemu workload at Quality::Draft (integer no-AA
# fast path) instead of the default Quality::Exact. `./dev.py qemu-m4 --draft`
# adds this feature; the M4 binary has no env, so the tier is a build-time
# selection (deterministic per build). Both legs (host + M4) pick it up.
draft = []
# #27: render the run-qemu workload at Quality::Fast (Draft's integer spans,
# but curves anti-aliased through the Exact tiny-skia path). Same build-time
# rule as `draft` — the M4 binary has no env. `./dev.py qemu-m4 --fast`.
# Mutually exclusive with `draft` (draft wins if both are somehow enabled,
# and the cfg below says so explicitly rather than silently).
fast = []
# The long ANIMATED workload (vyr-scene) instead of the single static
# fixture: `run-qemu` renders one frame N times, which prices a still frame
# and says nothing about a UI that changes. `rig` re-generates the IR every
# frame from the frame index, so the measured window contains what an
# animating device actually pays — scene emit, parse, glyph-cache churn,
# contour-memo churn — and the heap series over the run is the only thing
# that can show a slow leak. Strictly ADDITIVE to `run-qemu`: the published
# `./dev.py qemu-m4` numbers compile none of it.
rig = ["dep:vyr-scene"]
# `rig` at Detail::Lite — the MCU-fitting variant (smaller glyph repertoire
# and chart series). See vyr_scene::Detail.
rig-lite = ["rig"]
# Frame counts for `rig`, matching vyr_scene::Preset. Default (bare `rig`)
# is Short = 300 frames; these select Smoke = 60 and Full = 1200. A feature
# rather than an env var because the M4 binary has no env and the count must
# be part of the build the ELF hash pins.
rig-smoke = ["rig"]
rig-full = ["rig"]
# Bracket EVERY timed frame with a clock read, so the TCG plugin's
# `match=bkpt,trace=on` delta stream is a per-frame instruction SERIES rather
# than one aggregate window. Deliberately NOT the default: it invalidates
# scripts/qemu-insn.py's "largest delta is the timed window" rule (every
# delta is now one frame), so it is consumed by scripts/rig-insns.py, which
# reads all the deltas. Mean insns/frame from either is the same number.
rig-perframe = ["rig"]
# #33: measure the STACK high-water mark of a real run. Paints the unused
# CCM stack region with a known word at boot (before .bss is zeroed, so no
# static is touched) and scans it back up after the workload, printing
# `stack watermark=N B`. Strictly ADDITIVE to `run-qemu` and OFF by default:
# the painting loop and the scan both sit outside the timed window, but they
# do add a few hundred bytes of flash and can nudge code layout, so the
# published insns/frame numbers are always taken WITHOUT it. Used by
# scripts/optlevel-matrix.py to answer "does opt-level change stack depth?".
stack-probe = []
# F9 BOARD half (#9): the same runnable vehicle on REAL silicon — an
# STM32F429I-DISC1 (F429ZI, M4F @ up to 180 MHz, 2 M flash / 192 K SRAM +
# 64 K CCM). Implies run-qemu's runtime (vector table, crt0, semihosting,
# counted heap) and swaps ONLY the clock: DWT_CYCCNT counts real CPU cycles
# instead of qemu's SYS_CLOCK, which measures host wall time on a qemu built
# without TCG plugins and is therefore not an instruction count at all.
# Cycles on real silicon include the things emulation cannot model — flash
# wait states, the ART accelerator, bus contention — so this is the only
# honest per-frame cost. Build with ./dev.py board (link-board.ld).
board = ["run-qemu"]
# #28: draw a panel-native vyr frame on the DISC1's own 240x320 ILI9341 over
# SPI5. Strictly ADDITIVE to `board` — the measurement build
# (`--no-default-features --features board`) compiles none of this and is
# byte-for-byte the configuration the cycle/hash numbers were taken on.
# Nothing here enters the DWT-timed window: the panel scene renders and
# flushes before the timed loop starts, and flush cost is never priced as
# render cost. Runner: scripts/board-lcd.py.
lcd = ["board"]
# #28 follow-on: ANIMATE the panel by pushing only the pixels that changed —
# vyr_core::dirty_rects + an arbitrary CASET/PASET GRAM window, so both render
# and wire cost track dirty AREA rather than screen area. Strictly ADDITIVE to
# `lcd` (which is itself additive to `board`): the measurement build
# `--no-default-features --features board` compiles none of it, and nothing here
# is inside the DWT-timed 480x270 window. Runner: scripts/board-anim.py.
anim = ["lcd"]
# #30: the SAME 240x320 panel, driven the way ST drives it — FMC/SDRAM
# framebuffer, PLLSAI pixel clock, LTDC scanning it out over the ILI9341's
# 16-bit parallel RGB bus, SPI5 demoted to the register channel. Strictly
# ADDITIVE to `board` exactly as `lcd` is, and MUTUALLY EXCLUSIVE with `lcd`
# in practice (they set the controller's 0xF6 to opposite values; if both are
# enabled the LTDC path runs and the SPI pixel path is skipped). The
# measurement build (`--no-default-features --features board`) compiles none
# of it. Nothing here enters the DWT-timed 480x270 window; this leg opens its
# own and reports render and blit cycles separately.
# Runner: scripts/board-ltdc.py.
ltdc = ["board"]
# #45: MEASURE both presentation modes rather than assume one. Additive to
# `ltdc` in exactly the way `ltdc` is additive to `board`: it adds a SECOND,
# RGB888 framebuffer in SDRAM, renders straight into it through the same
# `render(tree, area, buf, stride)` entry point (no vyr-core change — `buf`
# was always the caller's memory), and prices it against the existing
# render-to-CCM-then-blit path per tier, full-frame and dirty-rect, with the
# memory-bandwidth probes that explain the result. `--features board` and
# `--features board,ltdc` compile none of it and are unchanged byte for byte.
# Runner: scripts/board-present.py.
present = ["ltdc"]
# The LABELLED COLOUR TEST CARD (display bring-up fixture): a panel-native
# 240x320 scene where every swatch carries the NAME of the colour it is
# supposed to be, so channel order is a reading and not a judgement call.
# Additive to every display leg and to the emulated/host legs alike:
#   --features board,lcd,testcard        card over SPI5 into ILI9341 GRAM
#   --features board,ltdc,testcard       card blitted (RGB888->RGB565) into SDRAM
#   --features board,ltdc,present,testcard  card rendered DIRECT as RGB888,
#                                        no software R/B swap by default — the
#                                        experiment (MADCTL default is 0x00)
#   --features run-qemu,testcard         card rendered for its HASH only
#                                        (host x86-64 and emulated M4)
# Requires run-qemu because the card is drawn with the same ASCII subset font
# and band buffer that leg owns. `--features board` compiles none of it and is
# byte-for-byte unchanged. Runners: scripts/board-testcard.py (board),
# scripts/testcard-host.py (reference PNG + cross-ISA hash).
testcard = ["run-qemu"]
# The CORNER AND ORIENTATION CARD — the SAME fixture with a different asset, not
# a second mechanism. `testcard` owns the machinery (band loop, body/identity
# split, hash, `reclaim`); this feature only decides which committed IR
# `testcard::CARD_IR` includes and what the human is told to read off the glass.
#
# It answers a question the colour card cannot: which PHYSICAL corner is the
# renderer's (0,0), which way +X and +Y run on the panel, and whether the scan
# is mirrored. Four numbered corner badges, two direction wedges, edge rulers
# and an origin block make all EIGHT orientations (4 rotations x mirrored/not)
# look different.
#   --features board,lcd,orientcard        card over SPI5 into ILI9341 GRAM
#   --features board,ltdc,orientcard       card blitted (RGB888->RGB565)
#   --features board,ltdc,present,orientcard  card rendered DIRECT as RGB888.
#                                        The software R/B swap defaults OFF like
#                                        every card now does (MADCTL=0x00 is the
#                                        shipped correction); `VYR_RB_SWAP=1`
#                                        turns the software pass back on if the
#                                        pending lcd-path reading refutes 0x00.
# `--features board` compiles none of it and is byte-for-byte unchanged.
# Runners: scripts/board-testcard.py --card orient (board),
# scripts/testcard-host.py --card orient (reference PNG + cross-ISA hash).
orientcard = ["testcard"]
# --- SPI link rate + DMA (#28 follow-on) ------------------------------------
# The SPI5 baud-rate divisor is NOT a feature: it is `VYR_SPI_BR`, an
# `option_env!` compile-time parameter read by `lcd::SPI_BR`, defaulting to
# /16 (5.625 MHz), the universally-safe rate. See vyr-size/src/lcd.rs. A rung is
# only meaningful with a read-back verdict attached (see `spicheck`); there is
# no authoritative datasheet for these clone panels, so the read-back IS the
# qualifier and it is per-unit. A feature would have needed one per rung.
#
# spicheck: the RATE VERDICT leg. Writes a deterministic high-transition
# pattern into ILI9341 GRAM at each rung of the divisor ladder and READS IT
# BACK over the bit-banged serial port (which the panel's own read ceiling
# governs, not SPI5's baud rate), folding the returned bytes to FNV-1a. A rung
# whose read-back hash equals the reference /16 rung's is bit-exact ON THE WIRE
# for THIS unit — a machine verdict with no human in the loop, and no claim
# about any other unit. Additive to `lcd`; the measurement build compiles none
# of it. Runner: scripts/board-spirate.py.
spicheck = ["lcd"]
# DMA IS THE DEFAULT FLUSH: with `lcd` compiled, `lcd::flush_rect` streams the
# pixel flush out of SPI5 with DMA2 Stream 4 Channel 2 (SPI5_TX per ST's CubeMX
# device database) instead of busy-waiting on TXE for ~513 cycles per pixel.
# Measured: CPU-blocked-on-wire fell 218 ms -> 10 ms at /16 because the RGB565
# conversion overlaps the transfer. The engine is hash-neutral — the per-band
# FNV fold happens on the source bytes before either engine sees them.
#
# spipio: OPT OUT of DMA and use the programmed-I/O busy-wait flush instead.
# The busy-wait path (`lcd::flush_rect_pio`) stays compiled in BOTH
# configurations so one flashed image can price the two against each other; this
# feature is how the comparison baseline is selected. Additive to `lcd`;
# `--features board` and `--features board,lcd` still compile the DMA default,
# and `--features board` (the measurement build) compiles no display code at
# all and is byte-for-byte unchanged.
spipio = ["lcd"]

[dependencies]
vyr-core = { path = "../vyr-core" }
# The frame-indexed animated scene (no_std + alloc, zero deps) — the SAME
# generator vyr-rig drives on the host, so the two legs animate identical
# pixels and their hashes are directly comparable across ISAs.
vyr-scene = { path = "../vyr-scene", optional = true }
# Real alloc/dealloc heap for the runnable vehicle only (MIT OR Apache-2.0;
# default features off: no spin lock — the M4 leg is single-threaded with no
# heap-touching interrupts, vyr-size wraps it in its own unsafe cell).
linked_list_allocator = { version = "0.10", optional = true, default-features = false }
