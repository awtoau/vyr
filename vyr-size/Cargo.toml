[package]
name = "vyr-size"
description = "F9 static-size measurement vehicle: a linked thumbv7em ELF over the real render path (NOT runnable firmware)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# A measurement stub, never a published crate.
publish = false

[features]
# Default = everything, so the host gate (check / clippy / test) compiles
# every cfg branch and `cargo run -p vyr-size` smoke-runs the full stub.
# The size matrix opts DOWN: `--no-default-features [--features font[,image]]`.
default = ["font", "image"]
# Bake fonts/roboto.ttf into .rodata + render the F5 text fixture (the MCU
# model: TTF in flash, glyph cache in RAM).
font = []
# Bake the 24x24 RGBA checker into .rodata + render the F6 image fixture
# (the F15 bake-to-flash model: decode is a build step, the device blits).
image = []
# The F9 RUNNABLE M4 vehicle (#9 dynamic half): vector table + crt0 +
# semihosting + a counted real heap (alloc AND dealloc — the bump arena
# can't run a banded frame) + the banded 480x270 workload over the ASCII
# subset font (assets/roboto-ascii.ttf). Build
# `--no-default-features --features run-qemu` (./dev.py qemu-m4) — its own
# config, never combined with font/image (those bake the size-matrix
# fixtures). On hosts this feature runs the SAME workload under a counting
# allocator and prints the same lines — the cross-ISA hash reference.
run-qemu = ["dep:linked_list_allocator"]
# F16 (#16): render the run-qemu workload at Quality::Draft (integer no-AA
# fast path) instead of the default Quality::Exact. `./dev.py qemu-m4 --draft`
# adds this feature; the M4 binary has no env, so the tier is a build-time
# selection (deterministic per build). Both legs (host + M4) pick it up.
draft = []
# #27: render the run-qemu workload at Quality::Fast (Draft's integer spans,
# but curves anti-aliased through the Exact tiny-skia path). Same build-time
# rule as `draft` — the M4 binary has no env. `./dev.py qemu-m4 --fast`.
# Mutually exclusive with `draft` (draft wins if both are somehow enabled,
# and the cfg below says so explicitly rather than silently).
fast = []
# #33: measure the STACK high-water mark of a real run. Paints the unused
# CCM stack region with a known word at boot (before .bss is zeroed, so no
# static is touched) and scans it back up after the workload, printing
# `stack watermark=N B`. Strictly ADDITIVE to `run-qemu` and OFF by default:
# the painting loop and the scan both sit outside the timed window, but they
# do add a few hundred bytes of flash and can nudge code layout, so the
# published insns/frame numbers are always taken WITHOUT it. Used by
# scripts/optlevel-matrix.py to answer "does opt-level change stack depth?".
stack-probe = []
# F9 BOARD half (#9): the same runnable vehicle on REAL silicon — an
# STM32F429I-DISC1 (F429ZI, M4F @ up to 180 MHz, 2 M flash / 192 K SRAM +
# 64 K CCM). Implies run-qemu's runtime (vector table, crt0, semihosting,
# counted heap) and swaps ONLY the clock: DWT_CYCCNT counts real CPU cycles
# instead of qemu's SYS_CLOCK, which measures host wall time on a qemu built
# without TCG plugins and is therefore not an instruction count at all.
# Cycles on real silicon include the things emulation cannot model — flash
# wait states, the ART accelerator, bus contention — so this is the only
# honest per-frame cost. Build with ./dev.py board (link-board.ld).
board = ["run-qemu"]
# #28: draw a panel-native vyr frame on the DISC1's own 240x320 ILI9341 over
# SPI5. Strictly ADDITIVE to `board` — the measurement build
# (`--no-default-features --features board`) compiles none of this and is
# byte-for-byte the configuration the cycle/hash numbers were taken on.
# Nothing here enters the DWT-timed window: the panel scene renders and
# flushes before the timed loop starts, and flush cost is never priced as
# render cost. Runner: scripts/board-lcd.py.
lcd = ["board"]
# #28 follow-on: ANIMATE the panel by pushing only the pixels that changed —
# vyr_core::dirty_rects + an arbitrary CASET/PASET GRAM window, so both render
# and wire cost track dirty AREA rather than screen area. Strictly ADDITIVE to
# `lcd` (which is itself additive to `board`): the measurement build
# `--no-default-features --features board` compiles none of it, and nothing here
# is inside the DWT-timed 480x270 window. Runner: scripts/board-anim.py.
anim = ["lcd"]
# #30: the SAME 240x320 panel, driven the way ST drives it — FMC/SDRAM
# framebuffer, PLLSAI pixel clock, LTDC scanning it out over the ILI9341's
# 16-bit parallel RGB bus, SPI5 demoted to the register channel. Strictly
# ADDITIVE to `board` exactly as `lcd` is, and MUTUALLY EXCLUSIVE with `lcd`
# in practice (they set the controller's 0xF6 to opposite values; if both are
# enabled the LTDC path runs and the SPI pixel path is skipped). The
# measurement build (`--no-default-features --features board`) compiles none
# of it. Nothing here enters the DWT-timed 480x270 window; this leg opens its
# own and reports render and blit cycles separately.
# Runner: scripts/board-ltdc.py.
ltdc = ["board"]
# #45: MEASURE both presentation modes rather than assume one. Additive to
# `ltdc` in exactly the way `ltdc` is additive to `board`: it adds a SECOND,
# RGB888 framebuffer in SDRAM, renders straight into it through the same
# `render(tree, area, buf, stride)` entry point (no vyr-core change — `buf`
# was always the caller's memory), and prices it against the existing
# render-to-CCM-then-blit path per tier, full-frame and dirty-rect, with the
# memory-bandwidth probes that explain the result. `--features board` and
# `--features board,ltdc` compile none of it and are unchanged byte for byte.
# Runner: scripts/board-present.py.
present = ["ltdc"]

[dependencies]
vyr-core = { path = "../vyr-core" }
# Real alloc/dealloc heap for the runnable vehicle only (MIT OR Apache-2.0;
# default features off: no spin lock — the M4 leg is single-threaded with no
# heap-touching interrupts, vyr-size wraps it in its own unsafe cell).
linked_list_allocator = { version = "0.10", optional = true, default-features = false }
